    <!-- Buffer and global polyfills must be loaded first -->
    <script>
      // Define global first
      if (typeof global === 'undefined') {
        window.global = globalThis;
      }
      
      // Immediate Buffer polyfill
      if (typeof Buffer === 'undefined') {
        // Create a minimal Buffer-like object
        window.Buffer = globalThis.Buffer = global.Buffer = {
          from: function(data) { return new Uint8Array(data); },
          isBuffer: function(obj) { return obj instanceof Uint8Array; },
          alloc: function(size) { return new Uint8Array(size); }
        };
      }
    </script>
